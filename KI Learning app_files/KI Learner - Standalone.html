/* ---------- Fonts (self-hosted, GDPR-safe — no Google CDN) ---------- */

  font-family: 'Fraunces';
  font-style: normal;
  font-weight: 600 800;
  font-display: swap;

}

  font-style: italic;
  font-weight: 600 800;
  font-display: swap;
  src: url("blob:https://019e1c98-e408-78d8-9128-ff63450c6e9c.claudeusercontent.com/94e95d5e-3c2f-4a33-bda4-430c36e44ffc") format('woff2');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 300 500;
  font-display: swap;
  src: url("blob:https://019e1c98-e408-78d8-9128-ff63450c6e9c.claudeusercontent.com/d251e7ac-aad2-4ee7-868e-04a023c193a0") format('woff2');
}

:root {
  /* ---------- Brand palette (HSL, from tailwind.config.ts + index.css) -- */
  --charcoal:    240 17% 15%;   /* #1f1f29 — primary foreground, deep near-black */
  --parchment:    36 30% 93%;   /* #f2ece0 — warm off-white page background */
  --warm-mid:     33 22% 88%;   /* #e6dfd3 — beige mid-tone, alt section bg */
  --dusk:        255 42% 87%;   /* #dcd4ee — lavender accent, panels + borders */
  --teal:        185 46% 59%;   /* #62bfc8 — brand secondary, metrics accent */
  --signal:       73 87% 63%;   /* #d2ef4a — signature chartreuse CTA */
  --muted-text:  240  6% 51%;   /* #7c7c87 — body muted + secondary copy */

  /* ---------- Foreground / background aliases ------------------------- */
  --background: hsl(var(--parchment));
  --foreground: hsl(var(--charcoal));

  /* ---------- Semantic roles ------------------------------------------ */
  --color-bg:            hsl(var(--parchment));
  --color-bg-alt:        hsl(var(--warm-mid));
  --color-bg-panel:      hsl(var(--dusk));
  --color-fg:            hsl(var(--charcoal));
  --color-fg-muted:      hsl(var(--muted-text));
  --color-border:        hsl(var(--dusk));
  --color-accent:        hsl(var(--teal));
  --color-accent-fg:     #ffffff;
  --color-primary:       hsl(var(--signal));
  --color-primary-fg:    hsl(var(--charcoal));
  --color-destructive:   hsl(0 84% 60%);

  /* ---------- Type families ------------------------------------------- */
  --font-display: 'Fraunces', 'Times New Roman', Georgia, serif;
  --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* ---------- Type scale (matches site-in-the-wild) ------------------- */
  --fs-eyebrow:   0.68rem;     /* uppercase section label */
  --fs-micro:     0.6rem;      /* chips, tag-badges */
  --fs-caption:   0.72rem;     /* metric labels */
  --fs-small:     0.85rem;
  --fs-body:      1rem;        /* ~16px */
  --fs-lead:      1.15rem;     /* pull quote */
  --fs-h4:        1.3rem;
  --fs-h3:        1.6rem;
  --fs-h2:        2.6rem;
  --fs-h1:        5rem;        /* desktop hero only */

  --tracking-eyebrow: 0.14em;
  --tracking-button:  0.12em;
  --tracking-chip:    0.10em;

  --lh-tight:   0.95;
  --lh-snug:    1.2;
  --lh-body:    1.85;
  --lh-quote:   1.65;

  /* ---------- Spacing / radius / motion ------------------------------- */
  --radius: 0px;       /* brand is deliberately square — no rounded buttons/cards */
  --radius-pill: 9999px;
  --maxw-content: 1100px;
  --section-pad-y: 5rem;     /* 80px — desktop section vertical rhythm */
  --section-pad-x: 4rem;     /* 64px — desktop */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 150ms;
  --dur-med:  300ms;
  --dur-slow: 600ms;
}

/* =========================================================================
   Semantic type — map raw scale to heading/body utility classes.
   Usage: <h1 class="h-hero">… or apply .eyebrow, .lead etc.
   ========================================================================= */

body {
  font-family: var(--font-body);
  font-weight: 300;
  color: var(--color-fg);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 700; }

.h-hero {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--fs-h1);
  line-height: var(--lh-tight);
  letter-spacing: -0.01em;
}
.h-section {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-h2);
  line-height: 1.1;
}
.h-section em, .h-hero em { font-style: italic; font-weight: 700; }

.h-card {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.1rem;
  line-height: 1.3;
}

.eyebrow {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--fs-eyebrow);
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  color: var(--color-fg-muted);
}

.section-label { /* same as eyebrow but charcoal body accent colour */
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: var(--tracking-eyebrow);
  color: var(--color-fg-muted);
  margin-bottom: 1rem;
}

.lead {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  font-size: var(--fs-lead);
  line-height: var(--lh-quote);
  color: var(--color-fg);
}

.body-copy {
  font-family: var(--font-body);
  font-weight: 300;
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--color-fg);
}

.muted { color: var(--color-fg-muted); }

.chip {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: var(--fs-micro);
  text-transform: uppercase;
  letter-spacing: var(--tracking-chip);
  padding: 0.5rem 1rem;
  border-radius: var(--radius-pill);
}

.tag {
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  padding: 0.375rem 0.75rem;
  background: var(--color-bg-panel);
  color: var(--color-fg);
  /* squared — no border-radius */
}

.btn {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: var(--tracking-button);
  padding: 0.75rem 1.75rem;
  transition: opacity var(--dur-med) var(--ease-out);
  text-decoration: none;
  cursor: pointer;
  border: 0;
}
.btn:hover { opacity: 0.85; }
.btn-primary   { background: var(--color-primary); color: var(--color-primary-fg); }
.btn-secondary { background: var(--color-accent);  color: var(--color-accent-fg); }
</style>
<style>/* Brand tokens already in tokens.css. This adds prototype-specific helpers. */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: hsl(var(--warm-mid));
  color: hsl(var(--charcoal));
}

/* Phone screen base: occupies the iOS device content area */
.phone-screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Progress bar at top */
.progress-row {
  display: flex;
  gap: 4px;
  padding: 14px 24px 0;
}
.progress-row .seg {
  flex: 1;
  height: 2px;
  background: hsl(var(--charcoal) / 0.12);
}
.progress-row .seg.done { background: hsl(var(--charcoal)); }
.progress-row .seg.now  { background: hsl(var(--signal)); }

/* Eyebrow */
.eb {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: hsl(var(--muted-text));
}

/* Display title */
.disp {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 38px;
  line-height: 1.04;
  letter-spacing: -0.01em;
  color: hsl(var(--charcoal));
  margin: 0;
}
.disp em { font-style: italic; font-weight: 700; }

.kicker {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 17px;
  line-height: 1.4;
  color: hsl(var(--charcoal));
}

.body-text {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 14.5px;
  line-height: 1.65;
  color: hsl(var(--charcoal));
}

.arrow-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.arrow-list li {
  display: grid;
  grid-template-columns: 18px 1fr;
  gap: 10px;
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 14px;
  line-height: 1.5;
}
.arrow-list li::before {
  content: '→';
  color: hsl(var(--teal));
  font-weight: 500;
}

/* Buttons */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 16px 22px;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: hsl(var(--signal));
  color: hsl(var(--charcoal));
  border: 0;
  cursor: pointer;
  transition: opacity 0.2s;
}
.cta:hover { opacity: 0.85; }
.cta.ghost { background: transparent; border: 1px solid hsl(var(--charcoal)); }
.cta.dusk  { background: hsl(var(--dusk)); }

/* Pull quote */
.pull {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 22px;
  line-height: 1.3;
  padding: 16px 0 16px 16px;
  border-left: 3px solid hsl(var(--signal));
  color: hsl(var(--charcoal));
}

/* Chip */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 10px;
  background: hsl(var(--dusk));
  color: hsl(var(--charcoal));
}

/* Quiz */
.quiz-opt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  background: transparent;
  border: 1px solid hsl(var(--dusk));
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: hsl(var(--charcoal));
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.quiz-opt:hover { background: hsl(var(--dusk) / 0.4); }
.quiz-opt.correct { background: hsl(var(--signal)); border-color: hsl(var(--signal)); }
.quiz-opt.wrong   { background: hsl(var(--warm-mid)); border-color: hsl(var(--charcoal) / 0.3); color: hsl(var(--charcoal) / 0.45); text-decoration: line-through; }

.quiz-opt .dot {
  width: 18px; height: 18px;
  border: 1px solid hsl(var(--charcoal) / 0.4);
  flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 600;
}
.quiz-opt.correct .dot { background: hsl(var(--charcoal)); color: hsl(var(--signal)); border-color: hsl(var(--charcoal)); }

/* Bottom nav */
.bot-nav {
  display: flex;
  gap: 10px;
  padding: 14px 22px 26px;
  border-top: 1px solid hsl(var(--charcoal) / 0.08);
}

/* Scrollable body region */
.screen-body { flex: 1; overflow-y: auto; padding: 18px 24px 24px; }
.screen-body::-webkit-scrollbar { width: 0; }

/* Variation B — geometric motifs */
.motif {
  width: 100%;
  aspect-ratio: 1.6 / 1;
  background: hsl(var(--dusk));
  position: relative;
  overflow: hidden;
}
.motif.parchment { background: hsl(var(--parchment)); }
.motif.warm { background: hsl(var(--warm-mid)); }

/* Variation C — progress card */
.progress-card {
  background: hsl(var(--parchment));
  border: 1px solid hsl(var(--charcoal));
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.dotrow { display: flex; gap: 4px; }
.dotrow .d { width: 6px; height: 6px; background: hsl(var(--charcoal) / 0.18); }
.dotrow .d.done { background: hsl(var(--charcoal)); }
.dotrow .d.now  { background: hsl(var(--signal)); width: 14px; }

/* Token demo */
.token {
  display: inline-block;
  padding: 4px 8px;
  margin: 2px 2px;
  background: hsl(var(--dusk));
  font-family: 'JetBrains Mono', 'SF Mono', monospace;
  font-size: 12px;
  color: hsl(var(--charcoal));
}
.token.pending { background: hsl(var(--signal)); }
.token.future { background: transparent; color: hsl(var(--muted-text)); border: 1px dashed hsl(var(--charcoal) / 0.2); }

/* Prompt demo */
.prompt-box {
  background: hsl(var(--parchment));
  border: 1px solid hsl(var(--charcoal));
  padding: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.5;
  color: hsl(var(--charcoal));
  white-space: pre-wrap;
  min-height: 110px;
}
.prompt-out {
  background: hsl(var(--charcoal));
  color: hsl(var(--parchment));
  padding: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.55;
  font-weight: 300;
}

/* Section starter screen with big number — Variation C */
.bignum {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 130px;
  line-height: 0.85;
  letter-spacing: -0.04em;
}

/* Animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-in > * { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
.fade-in > *:nth-child(1) { animation-delay: 0s; }
.fade-in > *:nth-child(2) { animation-delay: 0.05s; }
.fade-in > *:nth-child(3) { animation-delay: 0.1s; }
.fade-in > *:nth-child(4) { animation-delay: 0.15s; }
.fade-in > *:nth-child(5) { animation-delay: 0.2s; }
.fade-in > *:nth-child(6) { animation-delay: 0.25s; }
.fade-in > *:nth-child(7) { animation-delay: 0.3s; }
</style>

        {children}

  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {

// ─────────────────────────────────────────────────────────────

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({

}) {

    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});
</script>
  <script type="text/babel">// Shared geometric motifs — abstract shapes drawn in SVG using brand palette.
// Used by all three variations to illustrate each lesson.

const MotifSVG = ({ kind, accent }) => {
  const c = {
    charcoal: '#1f1f29',
    parchment: '#f2ece0',
    warm: '#e6dfd3',
    dusk: '#dcd4ee',
    teal: '#62bfc8',
    signal: '#d2ef4a',
  };
  const stroke = c.charcoal;

  if (kind === 'orbit') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <circle cx="160" cy="100" r="74" fill="none" stroke={stroke} strokeWidth="1"/>
        <circle cx="160" cy="100" r="50" fill="none" stroke={stroke} strokeWidth="1"/>
        <circle cx="160" cy="100" r="22" fill={c.signal}/>
        <circle cx="234" cy="100" r="6" fill={c.charcoal}/>
        <circle cx="135" cy="50" r="4" fill={c.teal}/>
        <circle cx="100" cy="135" r="3" fill={c.charcoal}/>
      </svg>
    );
  }
  if (kind === 'pattern') {
    // dot grid finding pattern
    const dots = [];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 12; x++) {
      const isHighlight = (x === 3 && y === 2) || (x === 4 && y === 3) || (x === 5 && y === 2) || (x === 6 && y === 3) || (x === 7 && y === 2);
      dots.push(<circle key={`${x}${y}`} cx={30 + x * 22} cy={30 + y * 22} r={isHighlight ? 4 : 2} fill={isHighlight ? c.signal : c.charcoal} opacity={isHighlight ? 1 : 0.4}/>);
    }
    return <svg viewBox="0 0 320 200" width="100%" height="100%">{dots}</svg>;
  }
  if (kind === 'grid') {
    const rows = [];
    for (let y = 0; y < 5; y++) for (let x = 0; x < 8; x++) {
      const filled = (x + y * 3) % 5 < 3;
      rows.push(<rect key={`${x}${y}`} x={20 + x * 36} y={20 + y * 32} width={28} height={24} fill={filled ? c.charcoal : 'none'} stroke={c.charcoal} strokeWidth="1"/>);
    }
    return <svg viewBox="0 0 320 200" width="100%" height="100%">{rows}</svg>;
  }
  if (kind === 'stream') {
    // tokens flowing
    const tokens = ['The', 'cat', 'sat', 'on', 'the'];
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        {tokens.map((t, i) => (
          <g key={i}>
            <rect x={20 + i * 56} y={80} width={48} height={28} fill={i === tokens.length - 1 ? c.signal : c.dusk}/>
            <text x={44 + i * 56} y={99} textAnchor="middle" fontFamily="Inter, sans-serif" fontSize="12" fill={c.charcoal}>{t}</text>
          </g>
        ))}
        <rect x={300} y={80} width={28} height={28} fill="none" stroke={c.charcoal} strokeDasharray="3 3"/>
        <text x={160} y={150} textAnchor="middle" fontFamily="Inter" fontSize="10" fill={c.charcoal} opacity="0.5" letterSpacing="1.5">PREDICTING NEXT</text>
      </svg>
    );
  }
  if (kind === 'tiles') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <rect x="20"  y="30" width="80" height="50" fill={c.dusk}/>
        <rect x="110" y="30" width="80" height="50" fill={c.signal}/>
        <rect x="200" y="30" width="100" height="50" fill={c.charcoal}/>
        <rect x="20"  y="90" width="100" height="50" fill={c.teal}/>
        <rect x="130" y="90" width="70" height="50" fill={c.parchment} stroke={c.charcoal}/>
        <rect x="210" y="90" width="90" height="50" fill={c.dusk}/>
        <rect x="20"  y="150" width="60" height="30" fill={c.signal}/>
        <rect x="90"  y="150" width="120" height="30" fill={c.charcoal}/>
        <rect x="220" y="150" width="80" height="30" fill={c.dusk}/>
      </svg>
    );
  }
  if (kind === 'void') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <circle cx="160" cy="100" r="60" fill={c.charcoal}/>
        <circle cx="160" cy="100" r="45" fill={c.warm}/>
        <line x1="100" y1="40" x2="220" y2="160" stroke={c.signal} strokeWidth="2"/>
      </svg>
    );
  }
  if (kind === 'mirror') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <rect x="60" y="40" width="90" height="120" fill={c.dusk}/>
        <rect x="170" y="40" width="90" height="120" fill={c.signal}/>
        <text x="105" y="105" textAnchor="middle" fontFamily="Fraunces, serif" fontStyle="italic" fontSize="44" fontWeight="700" fill={c.charcoal}>?</text>
        <text x="215" y="105" textAnchor="middle" fontFamily="Fraunces, serif" fontStyle="italic" fontSize="44" fontWeight="700" fill={c.charcoal}>!</text>
      </svg>
    );
  }
  if (kind === 'frame') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <rect x="30" y="30" width="260" height="140" fill="none" stroke={c.charcoal} strokeWidth="1"/>
        <rect x="50" y="50" width="220" height="100" fill="none" stroke={c.charcoal} strokeWidth="1"/>
        <rect x="70" y="70" width="180" height="60" fill={c.signal}/>
        <line x1="30" y1="30" x2="50" y2="50" stroke={c.charcoal}/>
        <line x1="290" y1="30" x2="270" y2="50" stroke={c.charcoal}/>
        <line x1="30" y1="170" x2="50" y2="150" stroke={c.charcoal}/>
        <line x1="290" y1="170" x2="270" y2="150" stroke={c.charcoal}/>
      </svg>
    );
  }
  if (kind === 'dots') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        {[0,1,2,3,4].map(i => (
          <circle key={i} cx={64 + i * 48} cy={100} r={i === 2 ? 22 : 14} fill={i === 2 ? c.signal : (i < 2 ? c.charcoal : c.dusk)}/>
        ))}
      </svg>
    );
  }
  if (kind === 'sun') {
    return (
      <svg viewBox="0 0 320 200" width="100%" height="100%">
        <circle cx="160" cy="170" r="120" fill={c.signal}/>
        {[...Array(12)].map((_, i) => {
          const a = (i / 12) * Math.PI;
          return <line key={i} x1={160 + Math.cos(a) * 130} y1={170 - Math.sin(a) * 130} x2={160 + Math.cos(a) * 155} y2={170 - Math.sin(a) * 155} stroke={c.charcoal} strokeWidth="2"/>;
        })}
      </svg>
    );
  }
  return null;
};

// Interactive token-prediction demo
function TokenDemo() {
  const [step, setStep] = React.useState(0);
  const tokens = ['The', 'best', 'way', 'to', 'predict'];
  const future = ['the', 'future', 'is', 'to'];
  return (
    <div style={{ background: '#f2ece0', padding: 16, border: '1px solid #1f1f29' }}>
      <div style={{ fontFamily: 'Inter', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#7c7c87', marginBottom: 10 }}>Watch it predict</div>
      <div style={{ marginBottom: 12, lineHeight: 1.9 }}>
        {tokens.slice(0, step + 1).map((t, i) => <span key={i} className="token">{t}</span>)}
        {step < tokens.length + future.length - 1 && <span className="token pending">{(tokens.concat(future))[step + 1]}</span>}
        {[...Array(Math.max(0, future.length - Math.max(0, step + 1 - tokens.length)))].map((_, i) => <span key={'f' + i} className="token future">···</span>)}
      </div>
      <button
        className="cta"
        onClick={() => setStep(s => (s + 1) % (tokens.length + future.length))}
        style={{ background: '#1f1f29', color: '#f2ece0', padding: '12px 16px', fontSize: 11 }}>
        <span>Predict next token</span>
        <span>→</span>
      </button>
    </div>
  );
}

// Interactive prompt demo
function PromptDemo() {
  const [variant, setVariant] = React.useState(0);
  const prompts = [
    { label: 'Vague', text: 'Write me something about dogs.', out: 'Dogs are loyal animals that have been companions to humans for thousands of years. They come in many breeds…' },
    { label: 'With context + format', text: 'Audience: parents of allergic kids.\nRole: a vet.\nFormat: 3 bullet points.\nTopic: hypoallergenic dogs.', out: '• Poodles, Schnauzers, and Bichons shed minimal dander.\n• Bathing weekly reduces allergens significantly.\n• Always trial-meet a breed before adopting.' },
  ];
  const p = prompts[variant];
  return (
    <div style={{ display: 'grid', gap: 10 }}>
      <div style={{ display: 'flex', gap: 6 }}>
        {prompts.map((pp, i) => (
          <button key={i} onClick={() => setVariant(i)} style={{
            flex: 1, padding: '10px 8px', fontSize: 10, letterSpacing: '0.12em',
            fontWeight: 500, textTransform: 'uppercase', cursor: 'pointer',
            background: i === variant ? '#1f1f29' : 'transparent',
            color: i === variant ? '#f2ece0' : '#1f1f29',
            border: '1px solid #1f1f29',
          }}>{pp.label}</button>
        ))}
      </div>
      <div className="prompt-box">{p.text}</div>
      <div style={{ fontFamily: 'Inter', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: '#7c7c87' }}>Output →</div>
      <div className="prompt-out">{p.out}</div>
    </div>
  );
}

window.MotifSVG = MotifSVG;
window.TokenDemo = TokenDemo;
window.PromptDemo = PromptDemo;
</script>
  <script type="text/babel">// Variation B — Geometric Lab

  const motifBg = bgs[idx];

  return (

        {lesson.kicker && (

        )}

        {lesson.body && (

        )}

        {lesson.grid && (
          <div style={{ marginTop: 18, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 1, background: '#dcd4ee', border: '1px solid #dcd4ee' }}>
            {lesson.grid.map(([k, v], i) => (
              <div key={i} style={{
                background: '#f2ece0', padding: '14px 12px',
                display: 'flex', flexDirection: 'column', gap: 4,
              }}>
                <span style={{ fontFamily: 'Fraunces', fontWeight: 700, fontSize: 14 }}>{k}</span>
                <span style={{ color: '#7c7c87', fontSize: 11.5, lineHeight: 1.4 }}>{v}</span>
              </div>
            ))}
          </div>
        )}

        {lesson.demo === 'tokens' && <div style={{ marginTop: 18 }}><TokenDemo/></div>}
        {lesson.demo === 'prompt' && <div style={{ marginTop: 18 }}><PromptDemo/></div>}

        {lesson.quiz && <VarBQuiz quiz={lesson.quiz}/>}

        {isFirst && (
          <div style={{ marginTop: 28 }}>
            <button className="cta" onClick={onNext}>
              <span>Begin the course</span><span>→</span>
            </button>
          </div>
        )}

        {isLast && (
          <div style={{ marginTop: 24 }}>
            <button className="cta" onClick={onRestart}>
              <span>{lesson.cta}</span><span>↻</span>
            </button>
          </div>
        )}
      </div>

      {!isFirst && !isLast && (
        <div className="bot-nav">
          <button className="cta ghost" onClick={onBack} style={{ flex: '0 0 64px' }}>
            <span>←</span><span/>
          </button>
          <button className="cta" onClick={onNext} style={{ flex: 1 }}>
            <span>Continue</span><span>→</span>
          </button>
        </div>
      )}
    </div>
  );
}

function VarBQuiz({ quiz }) {
  const [qi, setQi] = React.useState(0);
  const [picked, setPicked] = React.useState(null);
  const q = quiz[qi];
  const advance = () => { setPicked(null); setQi(i => (i + 1) % quiz.length); };
  return (
    <div style={{ marginTop: 18 }}>
      <div style={{ display: 'flex', gap: 4, marginBottom: 14 }}>
        {quiz.map((_, i) => (
          <div key={i} style={{ flex: 1, height: 3, background: i < qi ? '#1f1f29' : i === qi ? '#d2ef4a' : '#dcd4ee' }} />
        ))}
      </div>
      <p className="kicker" style={{ marginBottom: 14 }}>{q.q}</p>
      <div style={{ display: 'grid', gap: 8 }}>
        {q.a.map((opt, i) => {
          const isCorrect = picked !== null && i === q.correct;
          const isWrong = picked === i && i !== q.correct;
          return (
            <button key={i} className={`quiz-opt ${isCorrect ? 'correct' : ''} ${isWrong ? 'wrong' : ''}`}
                    onClick={() => picked === null && setPicked(i)}>
              <span className="dot">{String.fromCharCode(65 + i)}</span>
              <span>{opt}</span>
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <button className="cta" style={{ marginTop: 12 }} onClick={advance}>
          <span>{qi === quiz.length - 1 ? 'Finish' : 'Next'}</span><span>→</span>
        </button>
      )}
    </div>
  );
}

function VariationB() {
  const [idx, setIdx] = React.useState(0);
  const total = window.LESSONS.length;
  const lesson = window.LESSONS[idx];
  return (
    <IOSDevice width={390} height={844}>
      <VarBScreen
        lesson={lesson} idx={idx} total={total}
        onNext={() => setIdx(i => Math.min(total - 1, i + 1))}
        onBack={() => setIdx(i => Math.max(0, i - 1))}
        onRestart={() => setIdx(0)}
      />
    </IOSDevice>
  );
}

window.VariationB = VariationB;
</script>

  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<VariationB />);
  </script>


</body></html>
